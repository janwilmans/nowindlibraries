# builds and tests nwhostapp and builds nowindgui on Apple Silicon (without SDL, so emuv1 is skipped, see build-readme.txt)
name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja libftdi googletest
      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNOWIND_BUILD_GUI=ON -Bbuild/release
      - name: Build
        run: cmake --build build/release --target install
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      # --help prints the usage and exits with 1, so check the output: it shows the program loads (libftdi) and starts
      - name: Smoke test nwhostapp
        run: |
          build/release/install/nwhostapp.app/Contents/MacOS/nwhostapp --help > help.txt 2>&1 || true
          cat help.txt
          grep -q "Usage: nwhostapp" help.txt
      # zipped, so the bundle structure and the executable permission survive
      - name: Package
        run: |
          ditto -c -k --keepParent build/release/install/nwhostapp.app nwhostapp-macos-arm64.zip
          ditto -c -k --keepParent build/release/install/nowindgui.app nowindgui-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nwhostapp-macos-arm64
          path: nwhostapp-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nowindgui-macos-arm64
          path: nowindgui-macos-arm64.zip
